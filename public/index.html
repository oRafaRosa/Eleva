<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/eleva-seal-180-v3.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/eleva-seal-192-v2.png"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ELEVA the club" />
    <meta name="theme-color" content="#4B0B22" />
    <meta
      name="description"
      content="ELEVA the club. Experiências, conexões e desenvolvimento que integram corpo, mente e espírito."
    />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fbf7f3;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        min-height: 0;
      }
      button,
      a,
      [role="button"] {
        touch-action: manipulation;
      }
      *:focus-visible {
        outline: 2px solid #4b0b22;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para acessar o ELEVA the club.</noscript>
    <div id="root"></div>
  </body>
</html>

name: Validar ELEVA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar tipos e comportamento
        run: npm run typecheck && npm test && npm run test:sql
      - name: Conferir build Vercel
        run: npm run build:vercel
        env:
          EXPO_PUBLIC_SITE_URL: https://eleva-the-club.vercel.app
